amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    # ICP provides odom -> base_link; AMCL provides map -> odom.
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    laser_model_type: likelihood_field
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_likelihood_max_dist: 2.0
    laser_max_range: 20.0
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    update_min_a: 0.0
    update_min_d: 0.0
    transform_tolerance: 1.0
    # AMCL publishes map -> odom after an initial pose is supplied.
    tf_broadcast: true
