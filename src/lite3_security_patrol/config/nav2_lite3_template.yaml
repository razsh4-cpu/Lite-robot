# TEMPLATE ONLY — do not run until footprint, velocity calibration, TF, odom,
# localization, and Lite3 /cmd_vel handoff have passed physical validation.
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    # MEASURE_ON_ROBOT: all values intentionally safe/uncalibrated.
    min_x_velocity_threshold: 0.0
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.0
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      # MEASURE_ON_ROBOT: replace before enabling Nav2.
      robot_radius: 0.0
      observation_sources: scan
      scan:
        topic: /scan
        data_type: LaserScan
        marking: true
        clearing: true
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.0  # MEASURE_ON_ROBOT
