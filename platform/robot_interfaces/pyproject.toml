[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bipolix-robot-interfaces"
version = "0.1.0"
description = "Vendor-neutral robot contracts for the Bipolix platform"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[tool.setuptools]
packages = ["bipolix_robot_interfaces"]
