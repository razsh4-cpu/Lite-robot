amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    tf_broadcast: true
    transform_tolerance: 0.5
    # A fixed startup pose is unsafe when the robot may have been moved while off.
    # Localization is initialized by the guard and accepted only after scan-to-map validation.
    set_initial_pose: false
    initial_pose:
      x: -3.8884261112
      y: -0.0876352118
      z: 0.0
      yaw: 2.3153604785
    robot_model_type: nav2_amcl::OmniMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 20.0
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    update_min_a: 0.05
    update_min_d: 0.05
